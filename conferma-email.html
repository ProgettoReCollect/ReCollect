<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ReCollect — Email confermata con successo.">
  <title>Email confermata · ReCollect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:        #0d1b1e;
      --ink-2:      #2b3b3e;
      --ink-3:      #6b7d7f;
      --paper:      #eaf0f7;
      --hair:       rgba(13,27,30,0.10);
      --green:      #4ea635;
      --green-deep: #2f7a1f;
      --serif: 'Instrument Serif', 'Times New Roman', serif;
      --sans:  'Geist', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* stesso gradiente sottile di dati.html */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 12%, rgba(78,166,53,0.06), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(29,90,109,0.06), transparent 40%);
      pointer-events: none;
      z-index: -1;
    }

    a { text-decoration: none; color: inherit; }

    /* ── CONTENUTO CENTRALE ── */
    .page-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.70);
      border-radius: 24px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px -8px rgba(13,27,30,0.10);
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 20px;
      display: block;
    }

    .card-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--green-deep);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .card-eyebrow::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    .card-title {
      font-family: var(--serif);
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 14px;
    }
    .card-title em {
      font-style: italic;
      color: var(--green-deep);
    }

    .card-sub {
      font-size: 15px;
      color: var(--ink-2);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn-accedi {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--green-deep);
      color: #fff;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      padding: 13px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px -4px rgba(47,122,31,0.35);
    }
    .btn-accedi:hover {
      background: #246018;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -4px rgba(47,122,31,0.4);
    }
    .btn-accedi svg {
      width: 16px; height: 16px;
    }

    /* ── FOOTER ── */
    footer {
      padding: 28px 24px 36px;
      color: var(--ink-3);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-top: 1px solid var(--hair);
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }
    footer strong { color: var(--ink); font-weight: 600; }
    footer nav { display: flex; gap: 18px; flex-wrap: wrap; }
    footer a { transition: color .2s; }
    footer a:hover { color: var(--ink); }

    @media (max-width: 480px) {
      .card { padding: 40px 24px; }
      footer { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="page-wrap">
    <div class="card">
      <span class="icon">✅</span>
      <div class="card-eyebrow">Account verificato</div>
      <h1 class="card-title">Grazie per la <em>conferma!</em></h1>
      <p class="card-sub">Il tuo indirizzo email è stato verificato con successo. Puoi ora accedere al tuo profilo ReCollect.</p>
      <a href="profilo.html" class="btn-accedi">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1z"/>
          <path d="M8 5v3l2 2"/>
        </svg>
        Ritorna e accedi
      </a>
    </div>
  </div>

  <footer>
    <div><strong>ReCollect</strong> · ITES J. Barozzi × Tetra Pak · Modena 2025–2026</div>
    <nav aria-label="Footer">
      <a href="guida.html">Guida</a>
      <a href="dati.html">Dati</a>
      <a href="gioco.html">Gioco</a>
      <a href="profilo.html">Profilo</a>
      <a href="chi-siamo.html">Chi siamo</a>
    </nav>
  </footer>

</body>
</html>
